name: Documentation

on:
  pull_request:
    paths: ['docs/**', 'website/**', 'src/gramflux/**', 'pyproject.toml', '.github/workflows/docs.yml']
  push:
    branches: [v0.x-dev]
    paths: ['docs/**', 'website/**', 'src/gramflux/**', 'pyproject.toml', '.github/workflows/docs.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: Publish the verified site to GitHub Pages
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: website
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install reference generator
        run: python -m pip install -r requirements-runtime.lock .
        working-directory: .
      - name: Verify generated reference
        run: python -m gramflux.tools.docs --check
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/build

  deploy:
    if: >-
      github.ref_name == github.event.repository.default_branch &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && inputs.deploy))
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy verified documentation
        id: deployment
        uses: actions/deploy-pages@v4
