name: Explicit Telegram integration
on:
  workflow_dispatch:
    inputs:
      scope:
        type: choice
        required: true
        default: read-only
        options: [read-only, bot-login, self-roundtrip]
permissions:
  contents: read
concurrency:
  group: telegram-test-account
  cancel-in-progress: false
jobs:
  telegram:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: telegram-test
    env:
      GRAMFLUX_API_ID: ${{ secrets.GRAMFLUX_API_ID }}
      GRAMFLUX_API_HASH: ${{ secrets.GRAMFLUX_API_HASH }}
      GRAMFLUX_BOT_TOKEN: ${{ secrets.GRAMFLUX_BOT_TOKEN }}
      GRAMFLUX_LIVE: ${{ inputs.scope != 'bot-login' && '1' || '0' }}
      GRAMFLUX_LIVE_BOT: ${{ inputs.scope == 'bot-login' && '1' || '0' }}
      GRAMFLUX_LIVE_WRITE: ${{ inputs.scope == 'self-roundtrip' && '1' || '0' }}
    steps:
      - name: Set dedicated session location
        run: printf '%s\n' "GRAMFLUX_SESSION=$RUNNER_TEMP/gramflux-test.session" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.lock -e '.[dev]'
      - name: Prepare dedicated test session
        if: inputs.scope != 'bot-login'
        env:
          SESSION_BASE64: ${{ secrets.GRAMFLUX_TEST_SESSION_BASE64 }}
        run: |
          python - <<'PY'
          import base64
          import os
          value = os.environ.get("SESSION_BASE64", "")
          if not value:
              raise SystemExit("Dedicated Telegram test session is not configured")
          # Exclusive creation, owner-only permissions; never upload this file.
          data = base64.b64decode(value, validate=True)
          fd = os.open(os.environ["GRAMFLUX_SESSION"], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, "wb") as stream:
              stream.write(data)
          PY
      - name: Run explicitly selected live tests
        run: pytest tests/integration/test_live.py -q --tb=short
      - name: Remove session material
        if: always()
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          path = Path(os.environ["GRAMFLUX_SESSION"])
          for suffix in ("", "-wal", "-shm", "-journal", ".lock"):
              path.with_name(path.name + suffix).unlink(missing_ok=True)
          PY
