name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m pip install -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest
      - run: python -m gramflux.tools.schema verify
      - run: python -m build
      - run: python -m compileall -q examples
      - run: |
          python -m venv /tmp/gramflux-wheel
          /tmp/gramflux-wheel/bin/pip install dist/*.whl
          cd /tmp
          /tmp/gramflux-wheel/bin/python -c "import gramflux; from gramflux.tl import Codec; print(gramflux.__version__)"
          /tmp/gramflux-wheel/bin/python -m gramflux.tools.schema verify
  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pip-audit==2.10.1
      - run: pip-audit -r requirements-runtime.lock
